<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #191919;
            overflow: hidden;
            height: 78px; /* On force la hauteur pour "couper" ce qui dépasse */
        }

        /* Masque tout élément de copyright TradingView */
        .tradingview-widget-copyright, 
        #tradingview-copyright,
        div[class*="copyright"],
        span[class*="copyright"],
        a[href*="tradingview.com"] {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }
    </style>
</head>
<body>

    <script type="module" src="https://widgets.tradingview-widget.com/w/fr/tv-ticker-tape.js"></script>
    <tv-ticker-tape 
        symbols="FOREXCOM:SPXUSD,FOREXCOM:NSXUSD,FOREXCOM:DJI,FX:EURUSD,BITSTAMP:BTCUSD,BITSTAMP:ETHUSD,CMCMARKETS:GOLD" 
        theme="dark">
    </tv-ticker-tape>

</body>
</html>
