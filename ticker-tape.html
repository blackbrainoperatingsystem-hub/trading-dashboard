<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <style>
        /* On verrouille la taille de la page pour que le texte ne puisse pas exister */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            background-color: #191919;
            overflow: hidden !important;
            height: 46px !important; /* Hauteur exacte du bandeau */
            width: 100%;
        }

        #container {
            height: 46px !important;
            overflow: hidden !important;
            position: relative;
        }

        /* Une sécurité de plus pour essayer de le masquer si possible */
        iframe, .tradingview-widget-copyright {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="container">
        <script type="module" src="https://widgets.tradingview-widget.com/w/fr/tv-ticker-tape.js"></script>
        <tv-ticker-tape 
            symbols="FOREXCOM:SPXUSD,FOREXCOM:NSXUSD,FOREXCOM:DJI,FX:EURUSD,BITSTAMP:BTCUSD,BITSTAMP:ETHUSD,CMCMARKETS:GOLD" 
            theme="dark">
        </tv-ticker-tape>
    </div>
</body>
</html>
