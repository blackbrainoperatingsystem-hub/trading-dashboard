<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <style>
        /* Supprime les marges et force le fond sombre de Notion */
        body {
            margin: 0;
            padding: 0;
            background-color: #191919; 
            overflow: hidden;
        }

        /* --- LA RÈGLE POUR CACHER LE TEXTE --- */
        /* On cible toutes les classes possibles que TradingView utilise pour son copyright */
        .tradingview-widget-copyright, 
        div[class*="copyright"], 
        span[class*="copyright"],
        a[href*="tradingview.com"] {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
            height: 0 !important;
        }
    </style>
</head>
<body>

    <script type="module" src="https://widgets.tradingview-widget.com/w/fr/tv-ticker-tape.js"></script>
    <tv-ticker-tape 
        symbols="FOREXCOM:SPXUSD,FOREXCOM:NSXUSD,FOREXCOM:DJI,FX:EURUSD,BITSTAMP:BTCUSD,BITSTAMP:ETHUSD,CMCMARKETS:GOLD" 
        theme="dark">
    </tv-ticker-tape>

</body>
</html>
