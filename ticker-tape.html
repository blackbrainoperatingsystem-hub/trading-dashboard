<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <style>
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            background-color: #191919;
            overflow: hidden !important;
            /* On monte à 72px pour laisser passer le prix et le graphique */
            height: 72px !important; 
            width: 100%;
        }

        #container {
            height: 72px !important;
            overflow: hidden !important;
            position: relative;
        }

        /* On garde la sécurité pour le texte au cas où */
        .tradingview-widget-copyright, 
        div[class*="copyright"], 
        a[href*="tradingview.com"] {
            display: none !important;
            visibility: hidden !important;
        }
    </style>
</head>
<body>
    <div id="container">
        <script type="module" src="https://widgets.tradingview-widget.com/w/fr/tv-ticker-tape.js"></script>
        <tv-ticker-tape 
            symbols="FOREXCOM:SPXUSD,FOREXCOM:NSXUSD,FOREXCOM:DJI,FX:EURUSD,BITSTAMP:BTCUSD,BITSTAMP:ETHUSD,CMCMARKETS:GOLD" 
            theme="dark">
        </tv-ticker-tape>
    </div>
</body>
</html>
